<!-- app.component.html -->
<div
  id="top"
  class="min-h-screen transition-all duration-1000"
  [class]="'bg-gradient-to-br ' + currentTheme().bg"
>
  <!-- Mobile-optimized Header -->
  <header class="backdrop-blur-2xl bg-black/20 border-b border-white/10 shadow-2xl sticky top-0 z-50 mobile-header-safe">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 sm:py-4">
      <div class="flex items-center justify-between">
        <!-- Logo und Titel -->
        <div class="flex items-center space-x-3 sm:space-x-6 flex-1 min-w-0">
          <div class="relative flex-shrink-0">
            <div
              class="w-8 h-8 sm:w-12 sm:h-12 rounded-xl sm:rounded-2xl flex items-center justify-center shadow-2xl border-2 transition-all duration-300 hover:scale-110"
              [style.backgroundColor]="currentTheme().primary"
              [style.borderColor]="currentTheme().secondary"
              [style.boxShadow]="'0 0 30px ' + currentTheme().primary + '40'"
            >
              <span class="text-lg sm:text-2xl">📱</span>
            </div>
            <div
              class="absolute -top-1 -right-1 w-3 h-3 sm:w-4 sm:h-4 bg-green-400 rounded-full animate-pulse"
            ></div>
          </div>
          <div class="min-w-0 flex-1">
            <h1
              [class]="'text-lg sm:text-2xl lg:text-3xl font-black tracking-tight truncate ' + currentTheme().text"
            >
              <span class="hidden sm:inline">MENU</span
              ><span [style.color]="currentTheme().primary">FORGE</span>
            </h1>
            <p class="text-xs sm:text-sm text-gray-300 hidden sm:block">
              Digitaler Menü-Generator der nächsten Generation
            </p>
          </div>
        </div>

        <!-- Desktop Navigation -->
        <div class="hidden lg:flex items-center space-x-2">
          <button
            *ngFor="let view of views"
            (click)="setActiveView(view.id)"
            class="px-6 py-3 rounded-xl font-bold transition-all duration-300 capitalize flex items-center space-x-2"
            [style.backgroundColor]="
              activeView() === view.id ? currentTheme().primary : 'transparent'
            "
            [style.color]="activeView() === view.id ? 'black' : 'white'"
            [style.boxShadow]="
              activeView() === view.id
                ? '0 0 30px ' + currentTheme().primary + '40'
                : 'none'
            "
          >
            <span class="text-lg">{{ view.icon }}</span>
            <span>{{ view.label }}</span>
          </button>
        </div>

        <!-- Mobile Burger Menu Button -->
        <button
          class="lg:hidden p-2 rounded-lg transition-all duration-300"
          (click)="toggleMobileMenu()"
          [style.backgroundColor]="
            isMobileMenuOpen() ? currentTheme().primary + '20' : 'transparent'
          "
        >
          <div class="w-6 h-6 relative flex flex-col justify-center items-center">
            <span
              class="block h-0.5 w-6 bg-white transform transition-all duration-300"
              [class]="isMobileMenuOpen() ? 'rotate-45 translate-y-1.5' : ''"
            ></span>
            <span
              class="block h-0.5 w-6 bg-white transform transition-all duration-300 my-1"
              [class]="isMobileMenuOpen() ? 'opacity-0' : ''"
            ></span>
            <span
              class="block h-0.5 w-6 bg-white transform transition-all duration-300"
              [class]="
                isMobileMenuOpen() ? '-rotate-45 -translate-y-1.5' : ''
              "
            ></span>
          </div>
        </button>
      </div>

      <!-- Mobile Menu Dropdown -->
      <div
        class="lg:hidden overflow-hidden transition-all duration-300"
        [class]="isMobileMenuOpen() ? 'max-h-96 mt-4' : 'max-h-0'"
      >
        <div class="bg-black/30 rounded-2xl p-4 backdrop-blur-xl border border-white/10">
          <div class="space-y-2">
            <button
              *ngFor="let view of views"
              (click)="setActiveView(view.id); closeMobileMenu()"
              class="w-full px-4 py-3 rounded-xl font-medium transition-all duration-300 flex items-center space-x-3 text-left"
              [style.backgroundColor]="
                activeView() === view.id
                  ? currentTheme().primary
                  : 'transparent'
              "
              [style.color]="activeView() === view.id ? 'black' : 'white'"
            >
              <span class="text-xl">{{ view.icon }}</span>
              <span class="font-semibold">{{ view.label }}</span>
              <span *ngIf="activeView() === view.id" class="ml-auto text-lg"
                >✓</span
              >
            </button>
          </div>
          <div class="mt-4 pt-4 border-t border-white/10">
            <div class="text-xs text-gray-400 text-center">
              MenuForge • Digitaler Menü-Generator
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div
    *ngIf="isMobileMenuOpen()"
    class="lg:hidden fixed inset-0 bg-black/50 z-40 backdrop-blur-sm"
    (click)="closeMobileMenu()"
  ></div>

  <!-- Haupt-Container für alle Views -->
  <div class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-8 mobile-safe-area">
    <!-- Builder View -->
    <div *ngIf="activeView() === 'builder'" class="space-y-6 lg:space-y-0 lg:grid lg:grid-cols-4 lg:gap-8">
      <!-- Design Studio -->
      <div class="lg:col-span-1">
        <div class="backdrop-blur-xl rounded-2xl shadow-2xl border transition-all duration-500" [class]="currentTheme().card">
          <div class="p-4 border-b border-white/10">
            <div class="flex items-center space-x-2">
              <span class="text-xl">🎨</span>
              <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">Design Studio</h2>
            </div>
          </div>
          <div class="p-4 sm:p-6">
            <app-design-customizer></app-design-customizer>
          </div>
        </div>
      </div>
      <!-- Menu Builder -->
      <div class="lg:col-span-3">
        <div class="backdrop-blur-xl rounded-2xl shadow-2xl border transition-all duration-500" [class]="currentTheme().card">
          <div class="p-4 border-b border-white/10">
            <div class="flex items-center space-x-2">
              <span class="text-xl">🍽️</span>
              <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">Menü Builder</h2>
            </div>
          </div>
          <div class="p-4 sm:p-6">
            <app-menu-builder></app-menu-builder>
          </div>
        </div>
      </div>
    </div>

    <!-- Preview View -->
    <div *ngIf="activeView() === 'preview'" class="flex justify-center">
      <div class="backdrop-blur-xl rounded-2xl shadow-2xl border max-w-4xl w-full transition-all duration-500" [class]="currentTheme().card">
        <div class="p-4 border-b border-white/10">
          <div class="flex items-center space-x-2">
            <span class="text-xl">👁️</span>
            <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">Menü Vorschau</h2>
          </div>
        </div>
        <div class="p-4 sm:p-6">
          <app-menu-preview></app-menu-preview>
        </div>
      </div>
    </div>

    <!-- QR Generator View -->
    <div *ngIf="activeView() === 'qr'">
      <div class="backdrop-blur-xl rounded-2xl shadow-2xl border transition-all duration-500" [class]="currentTheme().card">
        <div class="p-4 border-b border-white/10">
          <div class="flex items-center space-x-2">
            <span class="text-xl">📱</span>
            <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">QR-Code Generator</h2>
          </div>
        </div>
        <div class="p-4 sm:p-6">
          <app-qr-generator></app-qr-generator>
        </div>
      </div>
    </div>

    <!-- Impressum View -->
    <div *ngIf="activeView() === 'imprint'" class="flex justify-center">
      <div class="backdrop-blur-xl rounded-2xl shadow-2xl border max-w-4xl w-full transition-all duration-500" [class]="currentTheme().card">
        <div class="p-4 border-b border-white/10">
          <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">Impressum</h2>
        </div>
        <div class="p-4 sm:p-6">
          <app-imprint></app-imprint>
        </div>
      </div>
    </div>

    <!-- Datenschutz View -->
    <div *ngIf="activeView() === 'privacy'" class="flex justify-center">
      <div class="backdrop-blur-xl rounded-2xl shadow-2xl border max-w-4xl w-full transition-all duration-500" [class]="currentTheme().card">
        <div class="p-4 border-b border-white/10">
          <h2 [class]="'text-lg sm:text-xl font-bold ' + currentTheme().text">Datenschutz</h2>
        </div>
        <div class="p-4 sm:p-6">
          <app-privacy-policy></app-privacy-policy>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Floating Action Button (nur im Builder) -->
  <!-- <div *ngIf="activeView() === 'builder'" class="fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-30 mobile-bottom-safe">
    <button
      (click)="togglePreviewMode()"
      class="w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-2xl transition-all duration-300 hover:scale-110 flex items-center justify-center"
      [style.backgroundColor]="currentTheme().primary"
      [style.boxShadow]="'0 0 40px ' + currentTheme().primary + '60'"
    >
      <span class="text-xl sm:text-2xl text-black">{{ isPreviewMode() ? '✏️' : '👁️' }}</span>
    </button>
  </div> -->

  <!-- Footer (nahtloses Anschließen ans Gradient-Background) -->
  <footer
    class="max-w-7xl mx-auto px-3 sm:px-6 py-6 border-t border-white/10 text-center"
    [class]="currentTheme().text"
  >
    <nav class="space-x-4">
      <a href="#top" (click)="setActiveView('imprint')" class="underline">Impressum</a>
      <a href="#top" (click)="setActiveView('privacy')" class="underline">Datenschutz</a>
    </nav>
  </footer>
</div>

<!-- Cookie-Banner immer anzeigen -->
<app-cookie-banner></app-cookie-banner>

<router-outlet></router-outlet>
